  <head>
    <meta charset="UTF-8" />

    <style>
      :root {
        --chat-sidebar: 320px;
      }
      main {
        padding: 0 !important;
        height: calc(100vh - 54px);
        display: flex;
        overflow: hidden;
      }
      .chat-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: var(--bg);
      }
      
      
      .chat-list-panel {
        width: var(--chat-sidebar);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: rgba(22, 22, 28, 0.5);
      }
      .chat-list-header {
        padding: 24px 20px;
        border-bottom: 1px solid var(--border);
      }
      .chat-list-header h2 {
        font-family: 'Unbounded', sans-serif;
        font-size: 16px;
        font-weight: 700;
      }
      .chat-items {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
      }
      .chat-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 4px;
      }
      .chat-item:hover {
        background: var(--surface2);
      }
      .chat-item.active {
        background: rgba(176, 136, 208, 0.1);
        border: 1px solid rgba(176, 136, 208, 0.15);
      }
      .ci-ava {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--surface3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Unbounded', sans-serif;
        font-weight: 800;
        font-size: 13px;
        color: var(--pink);
        flex-shrink: 0;
      }
      .chat-item.active .ci-ava {
        background: linear-gradient(135deg, var(--pink), var(--purple));
        color: #000;
      }
      .ci-info {
        flex: 1;
        min-width: 0;
      }
      .ci-name {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ci-last {
        font-size: 12px;
        color: var(--text3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      
      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        position: relative;
      }
      .chat-header {
        height: 70px;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        background: rgba(14, 14, 18, 0.8);
        backdrop-filter: blur(10px);
      }
      .ch-user {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .ch-name { font-weight: 800; font-size: 15px; }
      .ch-status { font-size: 11px; color: var(--green); display: flex; align-items: center; gap: 5px; }
      .ch-status::before { content: ''; width: 6px; height: 6px; background: currentColor; border-radius: 50%; }

      .messages-area {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .msg {
        max-width: 70%;
        display: flex;
        flex-direction: column;
      }
      .msg.received { align-self: flex-start; }
      .msg.sent { align-self: flex-end; }
      
      .msg-bubble {
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        position: relative;
      }
      .msg.received .msg-bubble {
        background: var(--surface2);
        color: var(--text);
        border-bottom-left-radius: 4px;
      }
      .msg.sent .msg-bubble {
        background: linear-gradient(135deg, var(--purple), var(--pink));
        color: #000;
        font-weight: 600;
        border-bottom-right-radius: 4px;
      }
      .msg-time {
        font-size: 10px;
        color: var(--text3);
        margin-top: 4px;
        padding: 0 4px;
      }
      .msg.sent .msg-time { text-align: right; }

      .input-area {
        padding: 20px 24px;
        background: var(--surface);
        border-top: 1px solid var(--border);
      }
      .input-wrapper {
        display: flex;
        gap: 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 6px 6px 6px 16px;
        align-items: center;
      }
      .chat-input {
        flex: 1;
        background: none;
        border: none;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        outline: none;
        padding: 8px 0;
      }
      .btn-send {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--pink);
        border: none;
        color: #000;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      .btn-send:hover { transform: scale(1.05); }

      .empty-chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text3);
        gap: 16px;
      }
      .empty-chat svg { opacity: 0.2; }

      
      @media (max-width: 900px) {
        .chat-list-panel { width: 80px; }
        .chat-list-header h2, .ci-info { display: none; }
        .chat-items { padding: 10px 5px; }
        .ci-ava { margin: 0 auto; }
      }

      
      @media (max-width: 768px) {
        main {
          padding: 0 !important;
          height: calc(100vh - 58px - 54px);
          overflow: hidden;
        }
        .chat-container {
          flex-direction: column;
          height: 100%;
        }
        
        .chat-list-panel {
          width: 100%;
          height: 100%;
          border-right: none;
          border-bottom: 1px solid var(--border);
          flex-shrink: 0;
        }
        .chat-list-header h2 { display: block; }
        .ci-info { display: block; }
        .chat-items { padding: 10px; }
        .ci-ava { margin: 0; }

        
        .chat-container.chat-open .chat-list-panel {
          display: none;
        }
        .chat-container.chat-open .chat-main {
          display: flex;
          height: 100%;
          width: 100%;
        }
        .chat-main {
          display: none;
        }

        
        .btn-back-to-list {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 36px;
          height: 36px;
          background: var(--surface2);
          border: 1px solid var(--border);
          border-radius: 10px;
          cursor: pointer;
          flex-shrink: 0;
          color: var(--text2);
        }
        .btn-back-to-list:hover { background: var(--surface3); }

        
        .input-wrapper {
          margin-right: 0 !important;
        }

        
        .msg-bubble { font-size: 15px; }
        .messages-area { padding: 16px; gap: 12px; }
        .chat-header { padding: 0 16px; height: 62px; }
        .input-area { padding: 12px 16px; }
      }

      
      @media (max-width: 480px) {
        .chat-item { padding: 10px; gap: 10px; }
        .ci-ava { width: 38px; height: 38px; font-size: 11px; border-radius: 10px; }
        .ci-name { font-size: 13px; }
        .ci-last { font-size: 11px; }
        .chat-list-header { padding: 16px; }
        .chat-list-header h2 { font-size: 14px; }
      }
    </style>
  </head>

            </div>
            <div class="chat-items" id="chatList">

          </div>

              </svg>

            </div>

            <div id="activeChat" style="display: none; flex-direction: column; height: 100%; width: 100%;">
              <div class="chat-header">
                <button class="btn-back-to-list" id="btnBackToList" title="Назад к списку" style="display:none;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="ch-user">
                  <div class="ci-ava" id="activeUserAva">??</div>
                  <div>
                    <div class="ch-name" id="activeUserName">Имя Пользователя</div>
                    <div class="ch-status">В сети</div>
                  </div>
                </div>
                <div class="ch-actions">
                </div>
              </div>

              <div class="messages-area" id="messagesArea">
                
              </div>

              <div class="input-area">
                <div class="input-wrapper" style="margin-right: 70px;">
                  <input type="text" class="chat-input" id="chatInput" placeholder="Введите сообщение...">
                  <button class="btn-send" id="btnSend">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

    <div id="toast-container"></div>

    <script>
      let _currentUser = null;
      let _activePartnerId = null;
      let _clients = [];

      async function initChat() {
        const urlParams = new URLSearchParams(window.location.search);
        const partnerId = urlParams.get('userId');
        
        _currentUser = JSON.parse(localStorage.getItem('ludo_user') || '{}');
        
        await loadChatList(partnerId);
        
        if (partnerId) {
          selectChat(partnerId);
        }
      }

      async function loadChatList(autoSelectId) {
        try {
          const res = await authFetch(`/api/experts/${_currentUser.id}/clients`);
          _clients = await res.json();
          
          const list = document.getElementById('chatList');
          if (!_clients.length) {
            list.innerHTML = '<div style="padding:20px; color:var(--text3); font-size:12px; text-align:center;">Учеников пока нет</div>';
            return;
          }

          list.innerHTML = _clients.map(c => `
            <div class="chat-item ${autoSelectId == c.id ? 'active' : ''}" onclick="selectChat(${c.id}, '${c.username}')" data-id="${c.id}">
              <div class="ci-ava">${c.username.slice(0,2).toUpperCase()}</div>
              <div class="ci-info">
                <div class="ci-name">${c.username}</div>
                <div class="ci-last">${c.quest_name || 'Активный квест'}</div>
              </div>
            </div>
          `).join('');
        } catch (e) {
          console.error('Load chat list error:', e);
        }
      }

      async function selectChat(partnerId, partnerName) {
        _activePartnerId = partnerId;
        
        
        let name = partnerName;
        if (!name && _clients.length) {
          const found = _clients.find(c => c.id == partnerId);
          if (found) name = found.username;
        }

        
        document.querySelectorAll('.chat-item').forEach(el => {
          el.classList.toggle('active', el.dataset.id == partnerId);
        });
        
        document.getElementById('emptyChat').style.display = 'none';
        document.getElementById('activeChat').style.display = 'flex';

        
        if (window.innerWidth <= 768) {
          document.querySelector('.chat-container').classList.add('chat-open');
        }
        
        if (name) {
          document.getElementById('activeUserName').textContent = name;
          document.getElementById('activeUserAva').textContent = name.slice(0,2).toUpperCase();
        }

        await loadHistory(partnerId);
      }

      async function loadHistory(partnerId) {
        const area = document.getElementById('messagesArea');
        area.innerHTML = '<div style="text-align:center; color:var(--text3); font-size:12px;">Загрузка истории...</div>';
        
        try {
          const res = await authFetch(`/api/chat/history/${partnerId}`);
          const history = await res.json();
          
          if (!history.length) {
            area.innerHTML = '<div style="text-align:center; color:var(--text3); font-size:12px; margin-top:20px;">История сообщений пуста. Напишите первым!</div>';
            return;
          }

          area.innerHTML = history.map(m => `
            <div class="msg ${m.sender_id == _currentUser.id ? 'sent' : 'received'}">
              <div class="msg-bubble">${m.content}</div>
              <div class="msg-time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
            </div>
          `).join('');
          
          area.scrollTop = area.scrollHeight;
        } catch (e) {
          area.innerHTML = '<div style="text-align:center; color:var(--red); font-size:12px;">Ошибка загрузки сообщений</div>';
        }
      }

      async function sendMessage() {
        const input = document.getElementById('chatInput');
        const content = input.value.trim();
        if (!content || !_activePartnerId) return;
        
        input.value = '';
        
        try {
          const res = await authFetch('/api/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ receiverId: _activePartnerId, content })
          });
          
          if (res.ok) {
            await loadHistory(_activePartnerId);
          } else {
            showToast('Ошибка при отправке', 'error');
          }
        } catch (e) {
          showToast('Ошибка сети', 'error');
        }
      }

      document.getElementById('btnSend').onclick = sendMessage;
      document.getElementById('chatInput').onkeypress = (e) => { if(e.key==='Enter') sendMessage(); };

      function showToast(msg, type = 'success') {
        const c = document.getElementById("toast-container"), t = document.createElement("div");
        t.className = `toast ${type}`; t.textContent = msg; c.appendChild(t);
        setTimeout(() => t.classList.add("show"), 10);
        setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 400); }, 3000);
      }

      function initMobileMenu() {
        const burger = document.getElementById("burgerBtn");
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.getElementById("sidebarOverlay");
        if (burger && sidebar && overlay) {
          burger.onclick = () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
          };
          overlay.onclick = () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
          };
        }

        
        const btnBack = document.getElementById('btnBackToList');
        const chatContainer = document.querySelector('.chat-container');
        if (btnBack) {
          btnBack.onclick = () => {
            chatContainer && chatContainer.classList.remove('chat-open');
            document.getElementById('activeChat').style.display = 'none';
            document.getElementById('emptyChat').style.display = 'flex';
          };
        }

        
        function checkMobile() {
          if (window.innerWidth <= 768 && btnBack) {
            btnBack.style.display = 'flex';
          } else if (btnBack) {
            btnBack.style.display = 'none';
          }
        }
        checkMobile();
        window.addEventListener('resize', checkMobile);
      }

      initChat();
      initMobileMenu();
      
      setInterval(() => { if(_activePartnerId) loadHistory(_activePartnerId); }, 5000);

    </script>
