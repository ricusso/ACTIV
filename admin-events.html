  <style>
    .page-hdr {
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .page-hdr h1 {
      font-family: "Unbounded", sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .page-hdr p {
      font-size: 13px;
      color: var(--text2);
      margin-top: 4px;
    }

    .filters-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px 10px 38px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      width: 14px;
      height: 14px;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 25px;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--pink);
      color: var(--text);
      background: var(--pink-soft);
    }

    .events-list {
      display: flex;
      flex-direction: column;
    }

    .activity-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
      cursor: pointer;
      animation: fadeIn 0.3s ease forwards;
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-item:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .activity-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .activity-icon.user {
      background: rgba(232, 168, 216, 0.1);
      color: var(--pink);
    }

    .activity-icon.money {
      background: rgba(110, 231, 160, 0.1);
      color: var(--green);
    }

    .activity-icon.alert {
      background: rgba(248, 113, 113, 0.1);
      color: var(--red);
    }

    .activity-icon.quest {
      background: rgba(176, 136, 208, 0.1);
      color: var(--purple);
    }

    .activity-content {
      flex: 1;
      min-width: 0;
    }

    .activity-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .activity-sub {
      font-size: 12px;
      color: var(--text2);
    }

    .activity-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .activity-time {
      font-size: 11px;
      color: var(--text3);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-live {
      background: rgba(110, 231, 160, 0.1);
      color: var(--green);
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      border: 1px solid rgba(110, 231, 160, 0.2);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <div id="toast-container"></div>

  <script>
    const eventsData = [
      {
        id: 1,
        type: "user",
        title: "Новый эксперт: yoga_maria",
        sub: "Ожидает верификации профиля",
        time: "2 мин",
        live: true,
        details: "Заявка #EX-442. Опыт: 5 лет. Сертификаты приложены.",
      },
      {
        id: 2,
        type: "money",
        title: "Выплата: alex_trainer",
        sub: "12 400 ₽ — перевод завершён",
        time: "8 мин",
        live: false,
        details: "Транзакция #TX-9921. Комиссия платформы: 1 240 ₽.",
      },
      {
        id: 3,
        type: "alert",
        title: "Жалоба на квест #882",
        sub: "Пользователь: runner_vova",
        time: "15 мин",
        live: true,
        details:
          "Причина: Оскорбления в чате квеста. Рекомендуется проверка модератором.",
      },
      {
        id: 4,
        type: "quest",
        title: "Квест «30 дней бега» опубликован",
        sub: "Эксперт: pro_runner · 34 участника",
        time: "31 мин",
        live: false,
        details:
          "Квест прошел автоматическую проверку и доступен в каталоге.",
      },
      {
        id: 5,
        type: "user",
        title: "blog_health_24 → партнёр",
        sub: "Подал заявку на партнёрство",
        time: "1 ч",
        live: false,
        details:
          "Профиль в Instagram: 24k подписчиков. Ожидает одобрения менеджером.",
      },
    ];

    let liveEnabled = true;

    function showToast(msg, type = "info") {
      const c = document.getElementById("toast-container"),
        t = document.createElement("div");
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.classList.add("show"), 10);
      setTimeout(() => {
        t.classList.remove("show");
        setTimeout(() => t.remove(), 400);
      }, 3000);
    }

    function renderEvents(filter = "all", search = "") {
      const container = document.getElementById("eventsContainer");
      const filtered = eventsData.filter((e) => {
        const matchesType = filter === "all" || e.type === filter;
        const matchesSearch =
          e.title.toLowerCase().includes(search.toLowerCase()) ||
          e.sub.toLowerCase().includes(search.toLowerCase());
        return matchesType && matchesSearch;
      });

      container.innerHTML = filtered
        .map(
          (e) => `
    <div class="activity-item" onclick="openEvent(${e.id})">
      <div class="activity-icon ${e.type}">
        ${getIcon(e.type)}
      </div>
      <div class="activity-content">
        <div class="activity-title">${e.title.replace(search, `<u>${search}</u>`)}</div>
        <div class="activity-sub">${e.sub}</div>
        <div class="activity-meta">
          <span class="activity-time">🕒 ${e.time}</span>
          ${e.live && liveEnabled ? '<span class="badge-live"><span class="badge-dot pulse"></span> Live</span>' : ""}
        </div>
      </div>
      <button class="filter-btn" style="height:32px; font-size:11px;">Детали</button>
    </div>
  `,
        )
        .join("");
    }

    function getIcon(type) {
      const icons = {
        user: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
        money:
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
        alert:
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
        quest:
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 7 12 12 2 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
      };
      return icons[type] || icons.user;
    }

    function openEvent(id) {
      const event = eventsData.find((e) => e.id === id);
      if (!event) return;
      document.getElementById("mTitle").textContent = event.title;
      document.getElementById("mBody").innerHTML = `
    <p style="color:var(--text2); font-size:14px; margin-bottom:12px;">Тип: <b>${event.type.toUpperCase()}</b> · Время: <b>${event.time}</b></p>
    <p style="font-size:15px; line-height:1.6;">${event.details}</p>
  `;
      const links = {
        user: "admin-moderation.html",
        money: "admin-finances.html",
        alert: "admin-moderation.html",
        quest: "admin-moderation.html",
      };
      const mFooter = document.querySelector("#eventModal .modal-footer");
      const existing = document.getElementById("mActionLink");
      if (existing) existing.remove();
      if (links[event.type]) {
        const btn = document.createElement("a");
        btn.id = "mActionLink";
        btn.href = links[event.type];
        btn.className = "btn-primary";
        btn.style.cssText =
          "text-decoration:none;display:inline-flex;align-items:center;gap:6px;";
        btn.textContent =
          event.type === "money"
            ? "Перейти к выплатам"
            : "Перейти к модерации";
        mFooter.appendChild(btn);
      }
      document.getElementById("eventModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("eventModal").classList.remove("active");
    }

    document.getElementById("eventSearch").addEventListener("input", (e) => {
      renderEvents(
        document.querySelector(".filter-btn.active").dataset.type,
        e.target.value,
      );
    });

    document.querySelectorAll(".filter-btn[data-type]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document
          .querySelectorAll(".filter-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderEvents(
          btn.dataset.type,
          document.getElementById("eventSearch").value,
        );
      });
    });

    document
      .getElementById("liveToggle")
      .addEventListener("click", function () {
        liveEnabled = !liveEnabled;
        this.classList.toggle("active", liveEnabled);
        showToast(liveEnabled ? "Live-режим включен" : "Live-режим выключен");
        renderEvents();
      });

    const burger = document.getElementById("burgerBtn"),
      sidebar = document.querySelector(".sidebar"),
      overlay = document.getElementById("sidebarOverlay");
    burger.onclick = () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("active");
    };
    overlay.onclick = () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    };

    renderEvents();
