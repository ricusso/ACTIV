<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <title>АКТИВ — Клиенты</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="user-sync.js"></script>
    <script src="expert-sidebar.js"></script>
    <link rel="stylesheet" href="admin.css">
    <style>
      
      :root {
        --bg: #0e0e12;
        --surface: #16161c;
        --surface2: #1e1e26;
        --surface3: #26262f;
        --pink: #e8a8d8;
        --purple: #b088d0;
        --text: #f0f0f6;
        --text2: #8888a0;
        --text3: #505062;
        --border: rgba(255, 255, 255, 0.055);
        --green: #6ee7a0;
        --orange: #ff9b4e;
        --sidebar: 240px;
        --r: 14px;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Plus Jakarta Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        overflow-x: hidden;
      }

      
      .sidebar {
        width: var(--sidebar);
        background: rgba(16, 16, 22, 0.95);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 200;
        backdrop-filter: blur(20px);
      }
      .sidebar-head { padding: 22px 18px 18px; border-bottom: 1px solid var(--border); }
      
      .logo {
        font-family: "Unbounded", sans-serif;
        font-size: 17px;
        font-weight: 900;
        color: var(--text);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 18px;
      }
      .logo-gem {
        width: 34px; height: 34px;
        filter: drop-shadow(0 0 14px rgba(232, 168, 216, 0.45));
      }
      .logo-text {
        background: linear-gradient(135deg, var(--text), var(--pink));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .nav-item {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 14px;
        color: var(--text2);
        text-decoration: none;
        font-size: 13px; font-weight: 700;
        border-radius: 7px;
        margin: 1px 8px;
        transition: all 0.2s;
      }
      .nav-item svg { width: 15px; height: 15px; opacity: 0.75; }
      .nav-item:hover { color: var(--text); background: var(--surface2); }
      .nav-item.active {
        color: var(--pink);
        background: rgba(232, 168, 216, 0.1);
        border: 1px solid rgba(232, 168, 216, 0.12);
      }
      .nav-item.active svg { opacity: 1; }

      .sidebar-footer { margin-top: auto; padding: 12px 18px 18px; border-top: 1px solid var(--border); }
      .sidebar-footer-links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 10px; }
      .sidebar-footer-links a { font-size: 11px; color: var(--text3); font-weight: 600; text-decoration: none; }
      .sidebar-footer-copy { font-size: 10px; color: var(--text3); }

      
      .page-wrap { margin-left: var(--sidebar); flex: 1; min-width: 0; }
      .topbar {
        height: 54px;
        background: rgba(14, 14, 18, 0.92);
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center; padding: 0 24px;
      }
      .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text2); }
      .breadcrumb span { color: var(--text); font-weight: 700; }

      main { padding: 28px 32px 60px; }
      .page-hdr h1 { font-family: "Unbounded", sans-serif; font-size: 22px; margin-bottom: 4px; }
      .page-hdr p { font-size: 13px; color: var(--text2); }

      .client-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 24px 0; }
      .cstat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; text-align: center; }
      .cstat-val { font-family: "Unbounded", sans-serif; font-size: 24px; font-weight: 700; color: var(--pink); }
      .cstat-lbl { font-size: 11px; color: var(--text3); font-weight: 700; text-transform: uppercase; margin-top: 6px; }

      .client-list { display: flex; flex-direction: column; gap: 12px; }
      .client-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; display: flex; align-items: center; gap: 20px; }
      .c-ava { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--pink), var(--purple)); display: flex; align-items: center; justify-content: center; font-family: "Unbounded", sans-serif; font-weight: 800; color: #000; }
      .c-info { flex: 1; }
      .c-name { font-size: 15px; font-weight: 800; }
      .c-sub { font-size: 12px; color: var(--text3); font-weight: 600; }
      .c-status { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
      .btn-chat { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 18px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; }

      @media (max-width: 768px) {
        .sidebar { display: none; }
        .page-wrap { margin-left: 0; }
      }
    </style>
  </head>
  <body>

          </div>
          <span class="logo-text">АКТИВ</span>
        </a>
      </div>
      
      <nav id="expertSidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-links">
          <a href="about.html">О нас</a>
          <a href="changelog.html">Changelog</a>
          <a href="partners.html">Партнёрам</a>
        </div>
        <div class="sidebar-footer-copy">© 2026 АКТИВ Platform</div>
      </div>
    </aside>

    <div class="page-wrap">
      <div class="topbar">
        <div class="breadcrumb">
          <a href="index.html" style="color:inherit; text-decoration:none">АКТИВ</a>
          <span style="color:var(--text3)">/</span>
          <a href="expert-profile-edit.html" style="color:inherit; text-decoration:none">Эксперт</a>
          <span style="color:var(--text3)">/</span>
          <span>Клиенты</span>
        </div>
      </div>

      <main>
        <div class="page-hdr">
          <h1>Клиенты и ученики</h1>
          <p>Управление вашими активными пользователями</p>
        </div>

        <div class="client-stats">
          <div class="cstat">
            <div class="cstat-val" id="totalCount">0</div>
            <div class="cstat-lbl">Всего учеников</div>
          </div>
          <div class="cstat">
            <div class="cstat-val" style="color: var(--green)">18</div>
            <div class="cstat-lbl">Завершено</div>
          </div>
        </div>

        <div class="client-list" id="clientList">
          <div style="padding: 40px; text-align: center; color: var(--text3)">Загрузка списка клиентов...</div>
        </div>
      </main>
    </div>

    <script>
      const _tok = localStorage.getItem('ludo_token');
      const _usr = JSON.parse(localStorage.getItem('ludo_user') || 'null');
      if (!_tok || !_usr || (_usr.role !== 'expert' && _usr.role !== 'admin')) {
        location.href = 'auth.html';
      }

      async function loadClients() {
        const list = document.getElementById('clientList');
        const countEl = document.getElementById('totalCount');

        try {
          const expertId = _usr.id;

          const response = await authFetch(`/api/experts/${expertId}/clients`);
          if (!response.ok) throw new Error('API ' + response.status);
          const clients = await response.json();

          countEl.textContent = clients.length;
          
          if (!clients.length) {
            list.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text3);">Активных клиентов нет</div>';
            return;
          }

          list.innerHTML = clients.map(c => `
            <div class="client-card">
              <div class="c-ava">${c.username.slice(0,2).toUpperCase()}</div>
              <div class="c-info">
                <div class="c-name">${c.username}</div>
                <div class="c-sub">Ур. ${c.level || 1} · ${c.quest_name}</div>
              </div>
              <div class="c-status">
                <div class="status-dot"></div>
                <span>Активен</span>
              </div>
              <button class="btn-chat" onclick="location.href='expert-chat.html?userId=${c.id}'">Чат</button>
            </div>
          `).join('');

        } catch (err) {
          console.error(err);
          list.innerHTML = '<div style="padding:40px; text-align:center; color:var(--red);">Ошибка загрузки</div>';
        }
      }
      loadClients();
    </script>
