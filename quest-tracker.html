<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <title>АКТИВ — Мои квесты</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
  <link rel="stylesheet" href="admin.css">
    <style>
      
      
      :root {
        --bg: #0e0e12;
        --surface: #16161c;
        --surface2: #1e1e26;
        --surface3: #26262f;
        --surface4: #2e2e3a;
        --pink: #e8a8d8;
        --pink2: #d488c4;
        --pink-glow: rgba(232, 168, 216, 0.18);
        --pink-soft: rgba(232, 168, 216, 0.07);
        --purple: #b088d0;
        --text: #f0f0f6;
        --text2: #8888a0;
        --text3: #505062;
        --border: rgba(255, 255, 255, 0.055);
        --border2: rgba(255, 255, 255, 0.1);
        --green: #6ee7a0;
        --red: #f87171;
        --orange: #ff9b4e;
        --blue: #7ec8e8;
        --gold: #fbbf24;
        --cyan: #5ee0d4;
        --r: 14px;
        --r-sm: 10px;
        --r-xs: 7px;
        --sidebar: 240px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
        max-width: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Plus Jakarta Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        line-height: 1.5;
        overflow-x: hidden;
      }

      
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
        opacity: 0.025;
        pointer-events: none;
        z-index: 9999;
      }

      
      .blob {
        position: fixed;
        pointer-events: none;
        z-index: 0;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.12;
        overflow: hidden;
      }
      .blob-1 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, var(--pink), transparent 70%);
        top: -200px;
        left: calc(var(--sidebar) - 100px);
      }
      .blob-2 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, var(--purple), transparent 70%);
        bottom: -100px;
        right: 100px;
      }
      .blob-3 {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, #7ec8e8, transparent 70%);
        top: 50%;
        right: 20%;
      }

      
      .sidebar {
        width: var(--sidebar);
        min-height: 100vh;
        background: rgba(16, 16, 22, 0.95);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 200;
        backdrop-filter: blur(20px);
        overflow-y: auto;
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .sidebar::-webkit-scrollbar {
        width: 3px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 10px;
      }
      .sidebar-head {
        padding: 22px 18px 18px;
        border-bottom: 1px solid var(--border);
      }

      
      .logo {
        font-family: "Unbounded", sans-serif;
        font-size: 17px;
        font-weight: 900;
        color: var(--text);
        text-decoration: none;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 18px;
      }
      .logo-gem {
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 0 14px rgba(232, 168, 216, 0.45));
        flex-shrink: 0;
      }
      .logo-gem svg {
        width: 34px;
        height: 34px;
      }
      .logo-text {
        background: linear-gradient(135deg, var(--text), var(--pink));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      
      .sidebar-user {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .sidebar-user:hover {
        border-color: rgba(232, 168, 216, 0.25);
      }
      .s-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--pink), var(--purple));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 13px;
        color: #fff;
        border: 2px solid rgba(232, 168, 216, 0.35);
        flex-shrink: 0;
        position: relative;
      }
      .s-avatar-online {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
        border: 2px solid var(--surface2);
      }
      .s-user-info {
        flex: 1;
        min-width: 0;
      }
      .s-user-name {
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .s-user-sub {
        font-size: 11px;
        color: var(--text3);
        font-weight: 600;
        margin-top: 1px;
      }
      .s-user-xp {
        font-size: 11px;
        font-weight: 800;
        color: var(--pink);
        background: var(--pink-soft);
        border: 1px solid rgba(232, 168, 216, 0.15);
        border-radius: 50px;
        padding: 2px 8px;
        white-space: nowrap;
      }

      
      .nav-section-lbl {
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text3);
        padding: 16px 18px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px 9px 14px;
        color: var(--text2);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        border-radius: var(--r-xs);
        margin: 1px 8px;
        transition:
          color 0.18s,
          background 0.18s;
        position: relative;
      }
      .nav-item svg {
        flex-shrink: 0;
        opacity: 0.75;
        width: 15px;
        height: 15px;
      }
      .nav-item:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .nav-item.active {
        color: var(--pink);
        background: linear-gradient(
          90deg,
          rgba(232, 168, 216, 0.1),
          rgba(232, 168, 216, 0.04)
        );
        border: 1px solid rgba(232, 168, 216, 0.12);
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 55%;
        background: linear-gradient(180deg, var(--pink), var(--purple));
        border-radius: 0 3px 3px 0;
        box-shadow: 0 0 10px var(--pink);
      }
      .nav-item.active svg {
        opacity: 1;
      }
      .nav-badge {
        margin-left: auto;
        background: rgba(248, 113, 113, 0.15);
        color: var(--red);
        font-size: 10px;
        font-weight: 800;
        border-radius: 50px;
        padding: 2px 7px;
        border: 1px solid rgba(248, 113, 113, 0.2);
      }
      .nav-badge.green {
        background: rgba(110, 231, 160, 0.1);
        color: var(--green);
        border-color: rgba(110, 231, 160, 0.2);
      }
      .nav-badge.gold {
        background: rgba(251, 191, 36, 0.1);
        color: var(--gold);
        border-color: rgba(251, 191, 36, 0.2);
      }
      .nav-badge.pink {
        background: var(--pink-soft);
        color: var(--pink);
        border-color: rgba(232, 168, 216, 0.15);
      }
      .nav-divider {
        height: 1px;
        background: var(--border);
        margin: 10px 18px;
      }

      
      .sidebar-footer {
        margin-top: auto;
        padding: 12px 18px 18px;
        border-top: 1px solid var(--border);
      }
      .sidebar-footer-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-bottom: 10px;
      }
      .sidebar-footer-links a {
        font-size: 11px;
        color: var(--text3);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.15s;
      }
      .sidebar-footer-links a:hover {
        color: var(--text2);
      }
      .sidebar-footer-copy {
        font-size: 10px;
        color: var(--text3);
        font-weight: 500;
      }

      
      .mobile-header {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: rgba(14, 14, 18, 0.97);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        z-index: 300;
        padding: 0 16px;
        align-items: center;
        gap: 12px;
      }
      .burger-btn {
        width: 36px;
        height: 36px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
      }
      .burger-line {
        width: 18px;
        height: 2px;
        background: var(--text);
        border-radius: 2px;
      }
      .mobile-logo {
        font-family: "Unbounded", sans-serif;
        font-size: 18px;
        font-weight: 900;
        text-decoration: none;
        color: var(--text);
      }
      .mobile-logo-link {
        display: flex;
        align-items: center;
        text-decoration: none;
      }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 180;
      }
      .sidebar-overlay.active {
        display: block;
      }

      
      .page-wrap {
        margin-left: var(--sidebar);
        flex: 1;
        min-height: 100vh;
        min-width: 0;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 1;
        max-width: calc(100% - var(--sidebar));
      }

      
      .topbar {
        height: 54px;
        background: rgba(14, 14, 18, 0.92);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 24px;
        position: sticky;
        top: 0;
        z-index: 100;
        flex-shrink: 0;
      }
      .topbar-left {
        flex: 1;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text2);
      }
      .breadcrumb a {
        color: var(--text2);
        text-decoration: none;
        transition: color 0.2s;
      }
      .breadcrumb a:hover {
        color: var(--text);
      }
      .breadcrumb .sep {
        color: var(--text3);
        font-size: 11px;
      }
      .breadcrumb span {
        color: var(--text);
        font-weight: 700;
      }
      .topbar-search {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 7px 13px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text3);
        min-width: 200px;
        cursor: text;
        transition: border-color 0.2s;
      }
      .topbar-search:hover {
        border-color: var(--border2);
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .notif-btn {
        width: 34px;
        height: 34px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        cursor: pointer;
      }
      .notif-dot {
        width: 6px;
        height: 6px;
        background: var(--pink);
        border-radius: 50%;
        position: absolute;
        top: 7px;
        right: 7px;
        border: 1.5px solid var(--bg);
      }

      
      main {
        padding: 28px 32px 60px;
      }

      .page-hdr {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 28px;
        gap: 16px;
      }
      .page-hdr h1 {
        font-family: "Unbounded", sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 4px;
      }
      .page-hdr p {
        font-size: 13px;
        color: var(--text2);
        font-weight: 600;
      }

      
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        overflow: hidden;
        position: relative;
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.018) 0%,
          transparent 50%
        );
        pointer-events: none;
      }
      .card-p {
        padding: 20px;
      }
      .card-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      .card-hdr h3 {
        font-size: 13px;
        font-weight: 800;
      }
      .card-hdr p {
        font-size: 11px;
        color: var(--text2);
        margin-top: 3px;
      }
      .card-title {
        font-family: "Unbounded", sans-serif;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-title svg {
        color: var(--purple);
        width: 16px;
        height: 16px;
      }
      .card-sub {
        font-size: 11px;
        color: var(--text3);
        font-weight: 600;
        margin-top: 2px;
      }

      
      .table-wrapper {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        padding: 14px 18px;
        font-size: 10px;
        font-weight: 800;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.01);
      }
      td {
        padding: 14px 18px;
        font-size: 13px;
        font-weight: 500;
        border-bottom: 1px solid var(--border);
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: rgba(255, 255, 255, 0.015);
      }

      
      .btn-primary {
        background: linear-gradient(135deg, var(--pink), var(--purple));
        color: #000;
        border: none;
        padding: 10px 22px;
        border-radius: 12px;
        font-weight: 800;
        font-size: 13px;
        font-family: "Plus Jakarta Sans", sans-serif;
        cursor: pointer;
        transition:
          transform 0.2s,
          opacity 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        opacity: 0.92;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        padding: 9px 18px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 12px;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }
      .btn-sm {
        padding: 6px 12px;
        border-radius: 9px;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid var(--border);
        background: none;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .btn-sm:hover {
        color: var(--text);
        border-color: var(--border2);
      }
      .btn-danger {
        background: rgba(248, 113, 113, 0.08);
        color: var(--red);
        border: 1px solid rgba(248, 113, 113, 0.18);
      }
      .btn-danger:hover {
        background: rgba(248, 113, 113, 0.15);
      }
      .btn-ghost {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }

      
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 50px;
        font-size: 10px;
        font-weight: 800;
      }
      .badge-new {
        background: rgba(232, 168, 216, 0.1);
        color: var(--pink);
        border: 1px solid rgba(232, 168, 216, 0.2);
      }
      .badge-open {
        background: rgba(94, 224, 212, 0.08);
        color: var(--cyan);
        border: 1px solid rgba(94, 224, 212, 0.15);
      }
      .badge-wait {
        background: rgba(251, 191, 36, 0.08);
        color: var(--gold);
        border: 1px solid rgba(251, 191, 36, 0.15);
      }
      .badge-closed {
        background: rgba(110, 231, 160, 0.08);
        color: var(--green);
        border: 1px solid rgba(110, 231, 160, 0.15);
      }
      .badge-rejected {
        background: rgba(248, 113, 113, 0.08);
        color: var(--red);
        border: 1px solid rgba(248, 113, 113, 0.15);
      }
      .badge-green {
        background: rgba(110, 231, 160, 0.1);
        color: var(--green);
        border: 1px solid rgba(110, 231, 160, 0.2);
      }
      .badge-red {
        background: rgba(248, 113, 113, 0.1);
        color: var(--red);
        border: 1px solid rgba(248, 113, 113, 0.2);
      }
      .badge-gold {
        background: rgba(251, 191, 36, 0.1);
        color: var(--gold);
        border: 1px solid rgba(251, 191, 36, 0.2);
      }
      .badge-purple {
        background: rgba(176, 136, 208, 0.1);
        color: var(--purple);
        border: 1px solid rgba(176, 136, 208, 0.2);
      }
      .badge-cyan {
        background: rgba(94, 224, 212, 0.1);
        color: var(--cyan);
        border: 1px solid rgba(94, 224, 212, 0.2);
      }
      .badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .badge-dot.pulse {
        animation: bdpulse 1.5s infinite;
      }
      @keyframes bdpulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      
      .form-group {
        margin-bottom: 18px;
      }
      .form-label {
        display: block;
        font-size: 10px;
        font-weight: 800;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 7px;
      }
      .form-input,
      .form-select,
      .form-textarea {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 11px 14px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        font-family: "Plus Jakarta Sans", sans-serif;
        outline: none;
        transition: border-color 0.2s;
      }
      .form-input:focus,
      .form-select:focus,
      .form-textarea:focus {
        border-color: rgba(232, 168, 216, 0.4);
      }
      .form-input::placeholder,
      .form-textarea::placeholder {
        color: var(--text3);
      }
      .form-textarea {
        resize: vertical;
        min-height: 80px;
      }
      .form-select {
        appearance: none;
        cursor: pointer;
      }

      
      #toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: 13px;
        padding: 12px 18px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        backdrop-filter: blur(10px);
        transform: translateX(120%);
        transition: transform 0.3s ease;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        max-width: 320px;
      }
      .toast.show {
        transform: translateX(0);
      }
      .toast.success {
        border-left: 3px solid var(--green);
      }
      .toast.error {
        border-left: 3px solid var(--red);
      }
      .toast.info {
        border-left: 3px solid var(--cyan);
      }

      
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .grid-3 {
        display: grid;

      .tag {

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(8px);
        z-index: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        visibility: hidden;
        opacity: 0;
        transition:
          opacity 0.22s,
          visibility 0.22s;
        padding: 16px;

      .modal-overlay.active {

      .modal {
        background: var(--surface);

      .modal-header {

        height: 34px;

        justify-content: center;
        font-size: 16px;

      .modal-close:hover {
        background: rgba(255, 255, 255, 0.1);

      .modal-body {

      .modal-footer {

    <style>
      .tracker-title {
        font-family: "Unbounded", sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 6px;
      }
      .tracker-subtitle {
        font-size: 13px;
        color: var(--text2);
        font-weight: 600;
        margin-bottom: 28px;
      }
      .tracker-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 28px;
      }
      .tracker-stat {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 18px 16px;
        text-align: center;
      }
      .tracker-stat-val {
        font-family: "Unbounded", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--pink);
        line-height: 1;
        margin-bottom: 6px;
      }
      .tracker-stat-lbl {
        font-size: 10px;
        font-weight: 800;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .days-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        margin-bottom: 28px;
      }
      .day-cell {
        aspect-ratio: 1;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 800;
        color: var(--text3);
        transition: all 0.2s;
        cursor: default;
        position: relative;
      }
      .day-cell.done {
        background: rgba(232, 168, 216, 0.12);
        border-color: rgba(232, 168, 216, 0.35);
        color: var(--pink);
      }
      .day-cell.done::after {
        content: "?";
        position: absolute;
        bottom: 4px;
        right: 6px;
        font-size: 9px;
        color: var(--pink);
        opacity: 0.7;
      }
      .day-cell.today {
        border-color: var(--purple);
        color: var(--text);
        background: rgba(176, 136, 208, 0.1);
        box-shadow: 0 0 14px rgba(176, 136, 208, 0.15);
      }
      .day-cell.future {
        opacity: 0.45;
      }
      .day-cell.skip {
        background: rgba(248, 113, 113, 0.06);
        border-color: rgba(248, 113, 113, 0.2);
        color: var(--red);
      }
      .btn-checkin {
        width: 100%;
        padding: 18px;
        border: none;
        border-radius: 16px;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .btn-checkin.available {
        background: linear-gradient(135deg, var(--pink), var(--purple));
        color: #000;
        box-shadow: 0 10px 28px rgba(232, 168, 216, 0.3);
      }
      .btn-checkin.available:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(232, 168, 216, 0.4);
      }
      .btn-checkin.done-today {
        background: rgba(110, 231, 160, 0.1);
        border: 1px solid rgba(110, 231, 160, 0.25);
        color: var(--green);
      }
      .btn-checkin.disabled {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text3);
        cursor: not-allowed;
      }
      .prog-bar-wrap {
        margin-bottom: 28px;
      }
      .prog-bar {
        height: 8px;
        background: var(--surface3);
        border-radius: 50px;
        overflow: hidden;
        margin: 8px 0 4px;
      }
      .prog-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--purple), var(--pink));
        border-radius: 50px;
        transition: width 0.6s ease;
      }
      .prog-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        color: var(--text3);
      }
      @media (max-width: 480px) {
        .days-grid {
          grid-template-columns: repeat(5, 1fr);
          gap: 6px;
        }
        .tracker-title {
          font-size: 20px;
        }
        .tracker-stats {
          gap: 10px;
        }
        .tracker-stat-val {
          font-size: 18px;
        }
      }
    </style>

    <script>
      function initMobileMenu() {
        const b = document.getElementById("burgerBtn");
        const s = document.querySelector(".sidebar");
        const o = document.getElementById("sidebarOverlay");
        if (b && s && o) {
          b.addEventListener("click", () => {
            s.classList.toggle("open");
            o.classList.toggle("active");
          });
          o.addEventListener("click", () => {
            s.classList.remove("open");
            o.classList.remove("active");
          });
        }
      }
      function showToast(msg, type = "success") {
        const c = document.getElementById("toast-container");
        const t = document.createElement("div");
        t.className = `toast ${type}`;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => t.classList.add("show"), 10);
        setTimeout(() => {
          t.classList.remove("show");
          setTimeout(() => t.remove(), 400);
        }, 3000);
      }

      
      const QUEST_DATA = {
        "30-days-run": {
          name: "30 дней бега",
          total: 30,
          xp: "+450 XP",
          type: "Личный",
          tasks: [
            "Разминка 5 мин + пробежка 10 мин в спокойном темпе.",
            "Пробежка 12 мин. Следи за дыханием: вдох носом, выдох ртом.",
            "15 мин непрерывного бега. Можно медленно — главное без остановок.",
            "Темповая пробежка: 5 мин разгон, 5 мин в темпе, 5 мин замедление.",
            "День отдыха: лёгкая растяжка 15 мин.",
            "20 мин в комфортном темпе. Прислушайся к телу.",
            "Недельный итог: запиши самочувствие и темп.",
            "25 мин бега. Добавь горку или лестницу.",
            "Интервалы: 1 мин быстро — 2 мин медленно ? 5.",
            "30 мин непрерывного бега. Ты уже молодец!",
            "День отдыха. Восстановление — часть тренировки.",
            "35 мин в темпе разговора.",
            "Бег + силовые: 20 мин бег + 10 мин приседания/отжимания.",
            "40 мин. Найди красивый маршрут.",
            "Промежуточный итог: сравни темп с первым днём.",
            "45 мин. Музыка или подкаст для мотивации.",
            "Горки: маршрут с подъёмами.",
            "День отдыха.",
            "50 мин в спокойном темпе.",
            "Финишная прямая начинается. 30 мин интервалов.",
            "Бег по лестнице ? 10 подъёмов.",
            "55 мин непрерывно.",
            "Лёгкий день: 20 мин трусца.",
            "60 мин — первый час! Запомни этот день.",
            "День отдыха. Заслужил.",
            "Скоростная тренировка: 10 ? 400м с отдыхом.",
            "Длинный бег 65 мин.",
            "Лёгкая пробежка 30 мин. Готовься к финалу.",
            "Предфинальный день: 70 мин в удовольствие.",
            "ФИНАЛ: 30 мин в полную силу. Ты сделал это! ??",
          ],
        },
        "early-rise": {
          name: "Ранний подъём (6:00)",
          total: 30,
          xp: "+350 XP",
          type: "Групповой",
          tasks: [
            "Поставь будильник на 6:00. Как проснёшься — сфотографируй окно.",
            "Встань, выпей стакан воды, выйди на свежий воздух.",
            "10 мин лёгкой зарядки сразу после подъёма.",
            "Напиши в чат квеста что-то позитивное о своём утре.",
            "Без телефона первые 30 мин после подъёма.",
            "Приготовь здоровый завтрак до 7:00.",
            "Недельный итог: как изменилось твоё утреннее состояние?",
          ],
        },
        "read-20": {
          name: "Читать 20 стр/день",
          total: 30,
          xp: "+200 XP",
          type: "Личный",
          tasks: [
            "Выбери книгу и прочитай первые 20 страниц.",
            "Запиши одну мысль из прочитанного.",
            "Читай 20 стр до 21:00 — не позже.",
            "Расскажи другу о книге в 2-3 предложениях.",
            "День отдыха: листай только если хочется.",
            "Прочитай 20 стр и отметь любимую цитату.",
            "Недельный итог: о чём книга за эту неделю?",
          ],
        },
        "morning-exercise": {
          name: "Зарядка 30 дней",
          total: 30,
          xp: "+450 XP",
          type: "Личный",
        },
        "morning-meditation": {
          name: "Медитация утром",
          total: 14,
          xp: "+150 XP",
          type: "Групповой",
        },
        "100-days-code": {
          name: "100 дней кода",
          total: 100,
          xp: "+600 XP",
          type: "Групповой",
        },
      };

      const MOTIVATIONS = {
        "30-days-run": [
          "Первый шаг — самый важный!",
          "Темп набран. Держи ритм!",
          "Неделя позади. Ты в форме!",
          "Половина пути. Не останавливайся!",
          "Финишная прямая. Дожми до конца!",
        ],
        default: [
          "Отличное начало!",
          "Ты в ритме!",
          "Продолжай движение!",
          "Середина пути. Держись!",
          "Финал близко!",
        ],
      };

      function getMotivation(questId, dayNum, total) {
        const msgs = MOTIVATIONS[questId] || MOTIVATIONS.default;
        const idx = Math.floor((dayNum / total) * (msgs.length - 1));
        return `День ${dayNum}: ${msgs[Math.min(idx, msgs.length - 1)]}`;
      }

      function getJoinedQuests() {
        try {
          return JSON.parse(
            localStorage.getItem("АКТИВ_joined_quests") || "[]",
          );
        } catch (e) {
          return [];
        }
      }

      function saveJoinedQuests(arr) {
        try {
          localStorage.setItem("АКТИВ_joined_quests", JSON.stringify(arr));
        } catch (e) {}
      }

      
      function getQuestId() {
        const p = new URLSearchParams(location.search);
        return p.get("id");
      }

      function loadQuest() {
        const id = getQuestId();
        let quest = null;

        
        const joined = getJoinedQuests();
        const stored = joined.find((q) => q.id === id);

        if (stored) {
          quest = {
            id: stored.id,
            name:
              stored.name || (QUEST_DATA[id] && QUEST_DATA[id].name) || "Квест",
            total: stored.total || 30,
            xp: stored.xp || "+0 XP",
            type: stored.type || "Личный",
            completedDays: stored.completedDays || [],
            cur: stored.cur || 0,
            prog: stored.prog || 0,
            tasks: stored.tasks || (QUEST_DATA[id] && QUEST_DATA[id].tasks) || null,
            description: stored.description || "",
            category: stored.category || "",
          };
        } else if (QUEST_DATA[id]) {
          quest = {
            id,
            ...QUEST_DATA[id],
            completedDays: [],
            cur: 0,
            prog: 0,
          };
        } else {
          document.getElementById("trackerContent").innerHTML =
            "<p style='color:var(--text2);padding:40px 0;text-align:center;'>Квест не найден. <a href='my-quests.html' style='color:var(--pink)'>Вернуться</a></p>";
          return;
        }

        renderTracker(quest);
      }

      function renderTracker(q) {
        document.getElementById("questBreadcrumb").textContent = q.name;
        document.title = q.name + " — АКТИВ";

        const today = new Date().toISOString().slice(0, 10);
        const checkedIn = q.completedDays.includes(today);
        const doneCount = q.completedDays.length;
        const prog = q.total > 0 ? Math.round((doneCount / q.total) * 100) : 0;
        const currentDay = doneCount + (checkedIn ? 0 : 1);
        const displayDay = Math.min(currentDay, q.total);

        
        const days = Array.from({ length: q.total }, (_, i) => i + 1);
        const daysHtml = days
          .map((d) => {
            const dateForDay = new Date();
            dateForDay.setDate(
              dateForDay.getDate() -
                (doneCount -
                  (q.completedDays.indexOf(q.completedDays[d - 1]) >= 0
                    ? d
                    : 0)),
            );

            let cls = "day-cell future";
            if (d <= doneCount) cls = "day-cell done";
            else if (d === doneCount + 1) cls = "day-cell today";

            return `<div class="${cls}">${d}</div>`;
          })
          .join("");

        const subtitle = checkedIn
          ? `День ${doneCount} выполнен ? Завтра — день ${doneCount + 1}`
          : getMotivation(q.id, displayDay, q.total);

        const btnHtml = checkedIn
          ? `<button class="btn-checkin done-today"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Сегодня уже отмечено</button>`
          : doneCount >= q.total
            ? `<button class="btn-checkin done-today">?? Квест завершён! ${q.xp}</button>`
            : `<button class="btn-checkin available" onclick="checkIn('${q.id}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Отметиться сегодня</button>`;

        document.getElementById("trackerContent").innerHTML = `
    <div class="tracker-title">${q.name}</div>
    <div class="tracker-subtitle">${subtitle}</div>

    <div class="tracker-stats">
      <div class="tracker-stat">
        <div class="tracker-stat-val">${doneCount}/${q.total}</div>
        <div class="tracker-stat-lbl">Выполнено дней</div>
      </div>
      <div class="tracker-stat">
        <div class="tracker-stat-val">${prog}%</div>
        <div class="tracker-stat-lbl">Прогресс</div>
      </div>
      <div class="tracker-stat">
        <div class="tracker-stat-val">${q.xp}</div>
        <div class="tracker-stat-lbl">XP за финиш</div>
      </div>
    </div>

    ${(q.tasks && q.tasks.length && !checkedIn && doneCount < q.total) ? `
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:24px;">
      <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--pink);margin-bottom:8px;">Задание дня ${displayDay}</div>
      <div style="font-size:14px;font-weight:600;line-height:1.5;color:var(--text);">${typeof q.tasks[doneCount] === 'string' ? q.tasks[doneCount] : (q.tasks[doneCount]?.description || q.tasks[doneCount]?.title || '')}</div>
    </div>` : ''}

    <div class="days-grid">${daysHtml}</div>

    ${btnHtml}
  `;
      }

      function checkIn(questId) {
        const today = new Date().toISOString().slice(0, 10);
        const joined = getJoinedQuests();
        const idx = joined.findIndex((q) => q.id === questId);

        let quest;
        if (idx >= 0) {
          quest = joined[idx];
          if (!quest.completedDays) quest.completedDays = [];
          if (!quest.completedDays.includes(today)) {
            quest.completedDays.push(today);
            quest.cur = quest.completedDays.length;
            quest.prog =
              quest.total > 0 ? Math.round((quest.cur / quest.total) * 100) : 0;
          }
          joined[idx] = quest;
        } else {
          const base = QUEST_DATA[questId] || {};
          quest = {
            id: questId,
            name: base.name || questId,
            total: base.total || 30,
            xp: base.xp || "+0 XP",
            type: base.type || "Личный",
            completedDays: [today],
            cur: 1,
            prog: Math.round((1 / (base.total || 30)) * 100),
            joinedAt: new Date().toISOString(),
          };
          joined.push(quest);
        }

        saveJoinedQuests(joined);
        showToast("День отмечен! Отличная работа ??");
        renderTracker(quest);
      }

      initMobileMenu();
      loadQuest();
    </script>
